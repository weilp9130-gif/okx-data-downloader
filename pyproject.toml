[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "okx-data-downloader"
version = "1.0.0"
description = "OKX 永续合约 K线/资金费率 下载器（PostgreSQL + TimescaleDB）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "websockets>=12.0",
    "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
include = ["app*", "cli"]

[tool.pytest.ini_options]
pythonpath = ["."]
